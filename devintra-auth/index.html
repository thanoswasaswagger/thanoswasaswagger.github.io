<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>Devintra — Google sign-in</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#171717;background:#fff7ed}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    .card{width:min(460px,100%);background:#fff;border:1px solid #fed7aa;border-radius:28px;padding:28px;box-shadow:0 22px 70px rgba(124,45,18,.12);text-align:center}
    .logo{width:58px;height:58px;border-radius:18px;margin:0 auto 14px;display:grid;place-items:center;background:linear-gradient(135deg,#ea580c,#dc2626);color:#fff;font-weight:900;font-size:22px}
    h1{font-size:24px;margin:0 0 8px}
    p{color:#57534e;line-height:1.55;margin:8px 0}
    .ok{color:#047857}.err{color:#b91c1c}
    .spinner{width:28px;height:28px;border:3px solid #fed7aa;border-top-color:#ea580c;border-radius:50%;margin:18px auto;animation:s 1s linear infinite}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">D</div>
    <h1>Finishing Google sign-in</h1>
    <div id="spinner" class="spinner"></div>
    <p id="status">Please keep this page open for a moment.</p>
  </main>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const spinner = document.getElementById('spinner');
      try {
        const state = new URLSearchParams(location.search).get('state') || '';
        const hash = new URLSearchParams(location.hash.replace(/^#/, ''));
        const accessToken = hash.get('access_token') || '';
        const errorDescription = hash.get('error_description') || hash.get('error') || '';
        if (errorDescription) throw new Error(errorDescription);
        if (!state || !accessToken) throw new Error('The Google sign-in response was incomplete. Please start again from Devintra.');

        const response = await fetch('https://dmmjlsrdohdzwcyfnlgt.supabase.co/functions/v1/google-auth-handoff', {
          method: 'POST',
          headers: {'Content-Type':'application/json'},
          body: JSON.stringify({action:'complete', state, access_token: accessToken})
        });
        const body = await response.json().catch(() => ({}));
        if (!response.ok || !body.ok) throw new Error(body.error || 'Could not finish Google sign-in.');

        spinner.style.display = 'none';
        status.className = 'ok';
        status.textContent = 'Google sign-in is complete. Return to the Devintra app — it will finish signing you in automatically.';
      } catch (error) {
        spinner.style.display = 'none';
        status.className = 'err';
        status.textContent = error && error.message ? error.message : 'Google sign-in could not be completed. Please return to Devintra and try again.';
      }
    })();
  </script>
</body>
</html>
